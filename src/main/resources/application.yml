spring:
  application:
    name: hex4j

  profiles:
    active: dev

  # ── Virtual Threads (requires Java 21+, ideally 25) ────────────────────────────
  # Tomcat no longer caps concurrency at server.tomcat.threads.max: each request
  # gets its own virtual thread and blocking I/O unmounts it from the carrier pool.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:hex4j;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
    hikari:
      # With virtual threads the pool, not the web server, is the real concurrency
      # limit. Size it against the database capacity, not against request rate.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: true
      path: /h2-console

  # Kafka disabled by default. Enable with: --spring.profiles.active=dev,kafka
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  # HTTP client used by RestClient. The JDK client is NIO-based and multiplexes
  # connections, which is what virtual threads need; SimpleClientHttpRequestFactory
  # (HttpURLConnection) is the worst fit.
  http:
    clients:
      imperative:
        factory: jdk

  # Redis (Lettuce, blocking) — used by the XDB cache adapter.
  # The pool is mandatory here: by default Lettuce shares ONE native connection
  # for every operation, which serializes all concurrent cache traffic.
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2000ms

  # Mail (SMTP) — used by SmtpEmailAdapter; Mailpit on port 1025 for tests
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jackson:
    time-zone: UTC
    # Align JsonMapper defaults with Jackson 2 behavior from Boot 3.x
    # (e.g. write-dates-as-timestamps: false)
    use-jackson2-defaults: true

server:
  port: 8080

# Application-specific configuration (parity with hex4w)
app:
  webclient:
    connect-timeout: 5000
    read-timeout: 10000
  notification:
    email:
      from: hex4j@localhost
      host: localhost
      port: 1025
      endpoint-enabled: false
  graphql:
    enabled: false
  aws:
    region: us-east-1
    endpoint: http://localhost:4566
    # Max concurrent HTTP connections of the AWS SDK clients. The SDK default is 50,
    # which becomes the real bottleneck as soon as Tomcat stops capping concurrency.
    max-connections: 100
  s3:
    region: us-east-1
    endpoint: http://localhost:4566
    force-path-style: true
  lambda:
    region: us-east-1
    endpoint: http://localhost:4566
  rabbitmq:
    host: localhost
    port: 5672
    exchange:
      default: hex4j.script.commands
      results: hex4j.script.results
    queue:
      script-commands: hex4j.script.commands
  scripts:
    location: classpath:scripts/
    whitelist: hello.js,example.js,services.js
    # Scripts are CPU-bound, so they run on a bounded pool of platform threads
    # instead of the request thread — a virtual thread would occupy a carrier
    # thread for the whole execution. pool-size 0 = auto (availableProcessors).
    pool-size: 0
    # Watchdog timeout. qjs4j 0.1.1 has no interrupt support, so a runaway script
    # keeps its worker until it returns on its own, but the caller is released.
    timeout-seconds: 30
  xdb:
    base-url: http://localhost:9990
    grpc:
      host: localhost
      port: 9991
    auth-type: basic
    auth-token: admin:admin
    cache:
      enabled: true
      ttl-seconds: 300

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    co.onmind.hex: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev

  rabbitmq:
    host: localhost
    port: 5672

logging:
  level:
    co.onmind.hex: DEBUG

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE

  sql:
    init:
      mode: never

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    root: WARN
    co.onmind.hex: INFO

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    co.onmind.hex: INFO
